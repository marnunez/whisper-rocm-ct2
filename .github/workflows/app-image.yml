name: App image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - requirements.txt
      - pyproject.toml
      - uv.lock
      - app/**
      - compose.yaml
      - .github/workflows/app-image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - pyproject.toml
      - uv.lock
      - app/**
      - compose.yaml
      - .github/workflows/app-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CACHE_IMAGE: ghcr.io/${{ github.repository }}:buildcache

jobs:
  build:
    name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }} app
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', env.CACHE_IMAGE) || '' }}
          provenance: false
