name: Base image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - .github/workflows/base-image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.base
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-base
  BASE_TAG: rocm7.2.3-ct2v4.7.1-gfx1100
  CACHE_IMAGE: ghcr.io/${{ github.repository }}-base:buildcache

jobs:
  build:
    name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }} base
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BASE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ROCm CTranslate2 base image for whisper-rocm-ct2
          build-args: |
            ROCM_ARCHS=gfx1100
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', env.CACHE_IMAGE) || '' }}
          provenance: false
